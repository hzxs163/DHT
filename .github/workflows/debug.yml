name: Debug yuhuage

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install curl_cffi
        run: pip install curl_cffi
      - name: Debug
        run: python debug_yuhuage.py
