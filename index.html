<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ø Magnet - 磁力搜索</title>
  <style>
    :root {
      --bg: #ffffff;
      --text-primary: #202124;
      --text-secondary: #70757a;
      --accent: #1a73e8;
      --accent-hover: #1557b0;
      --border: #e8eaed;
      --border-hover: #dadce0;
      --highlight-bg: #fef7e0;
      --card-shadow: 0 1px 3px rgba(0,0,0,0.06);
      --card-shadow-hover: 0 2px 8px rgba(0,0,0,0.1);
      --radius: 8px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px;
    }

    .header {
      width: 100%;
      max-width: 720px;
      padding: 60px 0 32px;
      text-align: center;
      transition: padding 0.3s ease;
    }

    .header.compact {
      padding: 24px 0 16px;
    }

    .logo {
      font-size: 32px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }

    .logo .zero {
      color: var(--accent);
    }

    .header.compact .logo {
      font-size: 22px;
      margin-bottom: 16px;
    }

    /* ---------- 搜索栏（下拉 + 输入框 + 按钮） ---------- */
    .search-form {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      position: relative;
    }

    /* 数据源下拉 */
    .source-dropdown {
      position: relative;
      flex-shrink: 0;
    }

    .source-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 44px;
      padding: 0 14px;
      font-size: 14px;
      font-family: var(--font);
      color: var(--text-primary);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .source-btn:hover {
      border-color: var(--border-hover);
    }

    .source-btn.open {
      border-color: var(--accent);
      box-shadow: 0 1px 6px rgba(26,115,232,0.15);
    }

    .source-btn .arrow {
      font-size: 10px;
      color: var(--text-secondary);
      transition: transform 0.2s;
    }

    .source-btn.open .arrow {
      transform: rotate(180deg);
    }

    .source-menu {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      min-width: 160px;
      padding: 6px 0;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      z-index: 100;
    }

    .source-menu.open {
      display: block;
    }

    .source-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      font-size: 13px;
      color: var(--text-primary);
      cursor: pointer;
      transition: background 0.15s;
    }

    .source-option:hover {
      background: #f8f9fa;
    }

    .source-option input[type="checkbox"] {
      cursor: pointer;
      accent-color: var(--accent);
      width: 15px;
      height: 15px;
    }

    .source-option span {
      user-select: none;
    }

    /* 搜索输入框 */
    .search-input-wrap {
      flex: 1;
      position: relative;
    }

    .search-input {
      width: 100%;
      height: 44px;
      padding: 0 20px;
      font-size: 15px;
      font-family: var(--font);
      color: var(--text-primary);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input::placeholder {
      color: #9aa0a6;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 1px 6px rgba(26,115,232,0.15);
    }

    .search-btn {
      height: 44px;
      padding: 0 24px;
      font-size: 15px;
      font-family: var(--font);
      font-weight: 500;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 24px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .search-btn:hover {
      background: var(--accent-hover);
    }

    .search-btn:disabled {
      background: #b0c4de;
      cursor: not-allowed;
    }

    .main {
      width: 100%;
      max-width: 720px;
      flex: 1;
      padding-bottom: 48px;
    }

    .result-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 16px;
      padding: 0 4px;
    }

    .result-bar .timing {
      color: #9aa0a6;
      margin-left: 6px;
    }

    .sort-options {
      display: flex;
      gap: 12px;
    }

    .sort-options a {
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.2s;
    }

    .sort-options a:hover {
      color: var(--text-primary);
    }

    .sort-options a.active {
      color: var(--text-primary);
      font-weight: 600;
    }

    .result-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result-card {
      padding: 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--card-shadow);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .result-card:hover {
      border-color: var(--border-hover);
      box-shadow: var(--card-shadow-hover);
    }

    .result-title {
      font-size: 16px;
      line-height: 1.5;
      color: var(--accent);
      text-decoration: none;
      display: block;
      margin-bottom: 10px;
      word-break: break-word;
    }

    .result-title:hover {
      text-decoration: underline;
    }

    .result-title mark {
      background: var(--highlight-bg);
      color: var(--text-primary);
      font-weight: 600;
      padding: 0 2px;
      border-radius: 2px;
    }

    .result-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .result-meta-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .result-meta-left .dot {
      color: #dadce0;
    }

    .result-source {
      font-size: 11px;
      color: #9aa0a6;
      background: #f1f3f4;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .magnet-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 8px 12px;
      background: #f8f9fa;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      overflow: hidden;
    }

    .magnet-row:hover {
      background: #e8f0fe;
      border-color: #c6dafc;
    }

    .magnet-row.copied {
      background: #e6f4ea;
      border-color: #ceead6;
    }

    .magnet-icon {
      flex-shrink: 0;
      color: var(--text-secondary);
    }

    .magnet-row.copied .magnet-icon {
      color: #34a853;
    }

    .magnet-text {
      font-size: 12px;
      font-family: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, monospace;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .magnet-row.copied .magnet-text {
      color: #34a853;
    }

    .loading {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .skeleton {
      height: 90px;
      background: linear-gradient(90deg, #f1f3f4 25%, #e8eaed 50%, #f1f3f4 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--radius);
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: var(--text-secondary);
    }

    .empty-state .icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .empty-state .title {
      font-size: 16px;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .empty-state .desc {
      font-size: 13px;
    }

    .empty-state .retry-btn {
      margin-top: 16px;
      padding: 8px 20px;
      font-size: 14px;
      font-family: var(--font);
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }

    .empty-state .retry-btn:hover {
      background: var(--accent-hover);
    }

    .hot-searches {
      margin-top: 24px;
      text-align: center;
    }

    .hot-searches .label {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .hot-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .hot-tag {
      padding: 6px 14px;
      font-size: 13px;
      color: var(--text-secondary);
      background: #f1f3f4;
      border-radius: 16px;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
    }

    .hot-tag:hover {
      background: #e8eaed;
      color: var(--text-primary);
    }

    .load-more {
      text-align: center;
      margin-top: 24px;
    }

    .load-more button {
      padding: 8px 24px;
      font-size: 14px;
      font-family: var(--font);
      color: var(--accent);
      background: none;
      border: 1px solid var(--border);
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .load-more button:hover {
      background: #f8f9fa;
      border-color: var(--border-hover);
    }

    .footer {
      width: 100%;
      max-width: 720px;
      padding: 20px 0;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 12px;
      color: var(--text-secondary);
    }

    @media (max-width: 768px) {
      .header {
        padding: 40px 0 24px;
      }

      .logo {
        font-size: 26px;
      }

      .search-form {
        flex-wrap: wrap;
      }

      .source-dropdown {
        order: 2;
      }

      .search-input-wrap {
        order: 1;
        flex: 1 0 100%;
      }

      .search-btn {
        order: 3;
        flex: 1;
      }

      .source-btn {
        height: 38px;
        padding: 0 12px;
        font-size: 13px;
      }

      .result-title {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>

  <header class="header" id="header">
    <div class="logo"><span class="zero">Ø</span> Magnet</div>
    <form class="search-form" id="searchForm">
      <div class="source-dropdown" id="sourceDropdown">
        <button type="button" class="source-btn" id="sourceBtn">
          <span id="sourceLabel">全部源</span>
          <span class="arrow">▼</span>
        </button>
        <div class="source-menu" id="sourceMenu">
          <label class="source-option">
            <input type="checkbox" value="0magnet" checked>
            <span>ØMagnet</span>
          </label>
          <label class="source-option">
            <input type="checkbox" value="xiaocao" checked>
            <span>小草磁力</span>
          </label>
        </div>
      </div>
      <div class="search-input-wrap">
        <input
          type="text"
          class="search-input"
          id="searchInput"
          placeholder="搜索磁力链接..."
          autocomplete="off"
          autofocus
        />
      </div>
      <button type="submit" class="search-btn" id="searchBtn">搜索</button>
    </form>
  </header>

  <main class="main" id="main">
    <div class="hot-searches" id="hotSearches">
      <div class="label">热门搜索</div>
      <div class="hot-tags">
        <a class="hot-tag" href="javascript:void(0)" data-q="CorelDRAW">CorelDRAW</a>
        <a class="hot-tag" href="javascript:void(0)" data-q="Photoshop">Photoshop</a>
        <a class="hot-tag" href="javascript:void(0)" data-q="Office">Office</a>
        <a class="hot-tag" href="javascript:void(0)" data-q="Windows">Windows</a>
        <a class="hot-tag" href="javascript:void(0)" data-q="AutoCAD">AutoCAD</a>
      </div>
    </div>

    <div id="resultArea"></div>
  </main>

  <footer class="footer">
    免责声明 · 本站仅聚合第三方搜索结果，不存储任何资源
  </footer>

  <script>
    const API_BASE = '';

    const header = document.getElementById('header');
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const resultArea = document.getElementById('resultArea');
    const hotSearches = document.getElementById('hotSearches');

    const sourceDropdown = document.getElementById('sourceDropdown');
    const sourceBtn = document.getElementById('sourceBtn');
    const sourceMenu = document.getElementById('sourceMenu');
    const sourceLabel = document.getElementById('sourceLabel');

    let currentQuery = '';
    let currentPage = 1;
    let currentSort = 'newest';
    let isLoading = false;

    // ---------- 数据源下拉交互 ----------
    sourceBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      sourceMenu.classList.toggle('open');
      sourceBtn.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!sourceDropdown.contains(e.target)) {
        sourceMenu.classList.remove('open');
        sourceBtn.classList.remove('open');
      }
    });

    sourceMenu.addEventListener('change', () => {
      updateSourceLabel();
    });

    function updateSourceLabel() {
      const checkboxes = sourceMenu.querySelectorAll('input[type="checkbox"]');
      const checked = Array.from(checkboxes).filter(c => c.checked);

      // 全部取消时自动恢复全选
      if (checked.length === 0) {
        checkboxes.forEach(c => c.checked = true);
        sourceLabel.textContent = '全部源';
        return;
      }

      if (checked.length === checkboxes.length) {
        sourceLabel.textContent = '全部源';
      } else {
        sourceLabel.textContent = checked.map(c => {
          const label = c.nextElementSibling;
          return label ? label.textContent : c.value;
        }).join('、');
      }
    }

    function getSelectedSources() {
      const checkboxes = sourceMenu.querySelectorAll('input[type="checkbox"]');
      const checked = Array.from(checkboxes).filter(c => c.checked);
      if (checked.length === 0) {
        return Array.from(checkboxes).map(c => c.value);
      }
      return checked.map(c => c.value);
    }

    // ---------- 搜索 ----------
    searchForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const q = searchInput.value.trim();
      if (q) doSearch(q, 1);
    });

    document.querySelectorAll('.hot-tag').forEach(tag => {
      tag.addEventListener('click', () => {
        const q = tag.dataset.q;
        searchInput.value = q;
        doSearch(q, 1);
      });
    });

    async function doSearch(query, page = 1) {
      if (isLoading) return;
      isLoading = true;

      currentQuery = query;
      currentPage = page;

      header.classList.add('compact');
      hotSearches.style.display = 'none';

      resultArea.innerHTML = `
        <div class="result-bar">
          <span>搜索中...</span>
        </div>
        <div class="loading">
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
        </div>
      `;

      searchBtn.disabled = true;
      searchBtn.textContent = '搜索中';

      try {
        const sources = getSelectedSources().join(',');
        const url = `${API_BASE}/api/search?q=${encodeURIComponent(query)}&page=${page}&sort=${currentSort}&sources=${encodeURIComponent(sources)}`;
        const res = await fetch(url);

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }

        const data = await res.json();
        renderResults(data, query, page);

      } catch (err) {
        console.error('搜索失败:', err);
        renderError();
      } finally {
        isLoading = false;
        searchBtn.disabled = false;
        searchBtn.textContent = '搜索';
      }
    }

    function renderResults(data, query, page) {
      const results = data.results || [];
      const total = data.total || results.length;
      const timing = data.timing || 0;

      if (results.length === 0) {
        resultArea.innerHTML = `
          <div class="empty-state">
            <div class="icon">😕</div>
            <div class="title">未找到相关结果</div>
            <div class="desc">试试其他关键词，或检查拼写</div>
          </div>
        `;
        return;
      }

      let html = `
        <div class="result-bar">
          <span>找到 ${total} 条结果 <span class="timing">— ${timing} ms</span></span>
          <div class="sort-options">
            <a href="javascript:void(0)" data-sort="relevance" class="${currentSort === 'relevance' ? 'active' : ''}">相关</a>
            <a href="javascript:void(0)" data-sort="newest" class="${currentSort === 'newest' ? 'active' : ''}">最新</a>
          </div>
        </div>
        <div class="result-list">
      `;

      results.forEach(item => {
        const name = highlightKeyword(item.name, query);
        const size = item.size || '未知';
        const date = item.date || '';
        const magnet = item.magnet || '';
        const source = item.source || '';

        html += `
          <div class="result-card">
            <a class="result-title" href="${item.detailUrl || '#'}" target="_blank" rel="noopener">
              ${name}
            </a>
            <div class="result-meta">
              <div class="result-meta-left">
                <span>${size}</span>
                ${date ? `<span class="dot">·</span><span>${date}</span>` : ''}
                ${source ? `<span class="result-source">${escapeHtml(source)}</span>` : ''}
              </div>
            </div>
            ${magnet ? `
              <div class="magnet-row" data-magnet="${escapeAttr(magnet)}" title="点击复制磁力链接">
                <svg class="magnet-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                  <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                </svg>
                <span class="magnet-text">${escapeHtml(magnet)}</span>
              </div>
            ` : ''}
          </div>
        `;
      });

      html += `</div>`;

      if (results.length > 0) {
        html += `
          <div class="load-more">
            <button id="loadMoreBtn">加载更多</button>
          </div>
        `;
      }

      resultArea.innerHTML = html;

      resultArea.querySelectorAll('.magnet-row').forEach(row => {
        row.addEventListener('click', () => copyMagnetRow(row));
      });

      resultArea.querySelectorAll('.sort-options a').forEach(a => {
        a.addEventListener('click', () => {
          currentSort = a.dataset.sort;
          doSearch(currentQuery, 1);
        });
      });

      const loadMoreBtn = document.getElementById('loadMoreBtn');
      if (loadMoreBtn) {
        loadMoreBtn.addEventListener('click', () => {
          doSearch(currentQuery, currentPage + 1);
        });
      }
    }

    function highlightKeyword(text, keyword) {
      if (!keyword) return escapeHtml(text);
      const escaped = escapeHtml(text);
      const escapedKeyword = escapeRegExp(escapeHtml(keyword));
      const regex = new RegExp(`(${escapedKeyword})`, 'gi');
      return escaped.replace(regex, '<mark>$1</mark>');
    }

    async function copyMagnetRow(row) {
      const magnet = row.dataset.magnet;
      if (!magnet) return;

      const textEl = row.querySelector('.magnet-text');
      const originalText = textEl.textContent;

      try {
        await navigator.clipboard.writeText(magnet);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = magnet;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }

      row.classList.add('copied');
      textEl.textContent = '已复制到剪贴板';
      setTimeout(() => {
        row.classList.remove('copied');
        textEl.textContent = originalText;
      }, 1500);
    }

    function renderError() {
      resultArea.innerHTML = `
        <div class="empty-state">
          <div class="icon">⚠️</div>
          <div class="title">数据源暂时不可用</div>
          <div class="desc">请稍后重试，或换个关键词</div>
          <button class="retry-btn" onclick="doSearch('${escapeAttr(currentQuery)}', 1)">重试</button>
        </div>
      `;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function escapeAttr(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function escapeRegExp(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }
  </script>
</body>
</html>
